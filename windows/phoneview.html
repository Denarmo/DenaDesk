<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'">
  <title>Phone</title>
  <link rel="stylesheet" href="phoneview.css">
  <link rel="stylesheet" href="../shared/aurora-aux.css">
</head>
<body>
  <header id="bar">
    <button id="panelBtn" class="ctl" title="Show or hide quick controls" aria-label="Show or hide quick controls"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M12.5 4v12"/></svg></button>
    <span id="title"></span>
    <span id="via" hidden></span>
  </header>
  <main id="stage">
    <canvas id="screen" tabindex="0"></canvas>
    <div id="status">Connecting to the phone…</div>
  </main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <!-- Quick settings above the centered, always visible phone navigation. -->
  <nav id="panel" aria-label="Phone controls"></nav>
  <nav id="navbar" aria-label="Phone navigation"></nav>
  <script src="../shared/vcam-feed.js"></script>
  <script src="phone-pointer.js"></script>
  <script src="phoneview-renderer.js"></script>
</body>
</html>
